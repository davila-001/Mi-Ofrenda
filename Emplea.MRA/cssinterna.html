<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adopta una Mascota</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff3e0;
            margin: 20px;
        }
        h1 {
            color: #e65100;
            text-align: center;
            font-size: 32px;
        }
        .subtitulo {
            text-align: center;
            font-size: 18px;
            color: #6d4c41;
        }
        img {
            display: block;
            margin: 20px auto;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .mensaje {
            font-size: 20px;
            text-align: center;
            color: #5d4037;
            font-weight: bold;
            margin: 25px 0;
        }
        .boton {
            text-align: center;
            margin-top: 30px;
        }
        button {
            background-color: #e65100;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
        }
        .nombre {
            text-align: right;
            margin-top: 30px;
            font-weight: bold;
            color: #e65100;
        }
    </style>
</head>
<body>

    <h1>🐾 Adopta una Mascota</h1>
    
    <p class="subtitulo">Dales un hogar, dales amor 💛</p>
    
    <img src="mascota.jpg" alt="Mascota esperando hogar">

    <p class="mensaje">"Adoptar no solo cambia su vida, también la tuya."</p>

    <div class="boton">
        <a href="contacto.html">
            <button>📞 Contáctanos</button>
        </a>
    </div>

    <p class="nombre">Nombre: Ingrid Nahomi Resendiz Arana</p>
</body>
</html>
